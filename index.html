<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Praktikum 1 - Scene Pertama</title>
    <script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script>
</head>

<body>
    <a-scene>
        <a-box position="-1 0.5 -3" rotation="0 45 0" color="#A618AD"></a-box>
        <a-sphere position="-3 1.25 -5" radius="1.25" color="#FF0000"></a-sphere>
        <a-cylinder position="2 0.75 -3" radius="0.5" height="1.5" color="#FF4D1D"></a-cylinder>
        <a-plane position="0 0 -4" rotation="-90 0 0" width="10" height="8" color="#20590D"></a-plane>
        <a-cone position="-3 0.5 -3" rotation="0 45 0" color="#F7FF0B"></a-cone>
        <a-sky color="lightskyblue"></a-sky>
    </a-scene>

</body>

</html>
